name: GreenStreet CI

on:
  push:
    branches:
      - feature/githubactions
  pull_request:
    branches:
      - develop

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/shreedharjolad

jobs:
  backend:
    name: Backend CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        working-directory: greenstreet/backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check Python files
        working-directory: greenstreet/backend
        run: |
          python -m compileall app

      - name: Backend CI completed
        run: |
          echo "Backend CI completed successfully."


  frontend:
    name: Frontend CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: greenstreet/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: greenstreet/frontend
        run: |
          npm ci

      - name: Build frontend
        working-directory: greenstreet/frontend
        run: |
          npm run build

      - name: Frontend CI completed
        run: |
          echo "Frontend CI completed successfully."


  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs:
      - backend
      - frontend

    outputs:
      backend_image: ${{ steps.images.outputs.backend_image }}
      frontend_image: ${{ steps.images.outputs.frontend_image }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set image tags
        id: images
        run: |
          SHA_TAG="${GITHUB_SHA}"

          echo "backend_image=${IMAGE_PREFIX}/greenstreet-backend:${SHA_TAG}" >> "$GITHUB_OUTPUT"
          echo "frontend_image=${IMAGE_PREFIX}/greenstreet-frontend:${SHA_TAG}" >> "$GITHUB_OUTPUT"

          echo "Backend image: ${IMAGE_PREFIX}/greenstreet-backend:${SHA_TAG}"
          echo "Frontend image: ${IMAGE_PREFIX}/greenstreet-frontend:${SHA_TAG}"

      - name: Build backend Docker image
        working-directory: greenstreet/backend
        run: |
          docker build -t "${{ steps.images.outputs.backend_image }}" .

      - name: Build frontend Docker image
        working-directory: greenstreet/frontend
        run: |
          docker build -t "${{ steps.images.outputs.frontend_image }}" .

      - name: Show Docker images
        run: |
          docker images | grep greenstreet

      - name: Docker build completed
        run: |
          echo "Docker images built successfully."


  security:
    name: Trivy Security Scan
    runs-on: ubuntu-latest
    needs:
      - docker

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Build backend Docker image
        working-directory: greenstreet/backend
        run: |
          docker build -t "greenstreet-backend:scan" .

      - name: Build frontend Docker image
        working-directory: greenstreet/frontend
        run: |
          docker build -t "greenstreet-frontend:scan" .

      - name: Build Oracle frontend Docker image
        run: |
          docker build \
            -f greenstreet/frontend/Dockerfile-cloud \
            -t greenstreet-frontend-cloud:scan \
            greenstreet/frontend

      - name: Install Trivy
        run: |
          sudo apt-get update
          sudo apt-get install -y wget apt-transport-https gnupg lsb-release

          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key \
            | gpg --dearmor \
            | sudo tee /usr/share/keyrings/trivy.gpg > /dev/null

          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb $(lsb_release -sc) main" \
            | sudo tee /etc/apt/sources.list.d/trivy.list

          sudo apt-get update
          sudo apt-get install -y trivy

      - name: Scan backend image
        run: |
          trivy image --severity HIGH,CRITICAL --ignore-unfixed --format table greenstreet-backend:scan

      - name: Scan frontend image
        run: |
          trivy image --severity HIGH,CRITICAL --ignore-unfixed --format table greenstreet-frontend:scan
          
      - name: Scan Oracle frontend image
        run: |
          trivy image --severity HIGH,CRITICAL --ignore-unfixed --format table greenstreet-frontend-cloud:scan

      - name: Security scan completed
        run: |
          echo "Trivy security scans completed successfully."


  publish:
    if: github.event_name == 'push'
    needs: [docker, security]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend
        run: |
          docker build \
            -t ghcr.io/shreedharjolad/greenstreet-backend:${GITHUB_SHA} \
            -t ghcr.io/shreedharjolad/greenstreet-backend:latest \
            greenstreet/backend

          docker push ghcr.io/shreedharjolad/greenstreet-backend:${GITHUB_SHA}
          docker push ghcr.io/shreedharjolad/greenstreet-backend:latest

      - name: Build and push Oracle frontend
        run: |
          docker build \
            -f greenstreet/frontend/Dockerfile-cloud \
            -t ghcr.io/shreedharjolad/greenstreet-frontend-cloud:${GITHUB_SHA} \
            -t ghcr.io/shreedharjolad/greenstreet-frontend-cloud:latest \
            greenstreet/frontend

          docker push ghcr.io/shreedharjolad/greenstreet-frontend-cloud:${GITHUB_SHA}
          docker push ghcr.io/shreedharjolad/greenstreet-frontend-cloud:latest

  deploy-oracle:
    name: Deploy to Oracle Cloud
    runs-on: ubuntu-latest

    needs:
      - publish

    if: github.event_name == 'push' && needs.publish.result == 'success'

    permissions:
      contents: read

    steps:
      - name: Configure SSH
        env:
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
          ORACLE_KNOWN_HOSTS: ${{ secrets.ORACLE_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$ORACLE_SSH_KEY" > ~/.ssh/greenstreet_oracle
          chmod 600 ~/.ssh/greenstreet_oracle

          printf '%s\n' "$ORACLE_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy GreenStreet on Oracle VM
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_USER: ${{ secrets.ORACLE_USER }}
          ORACLE_APP_DIR: ${{ secrets.ORACLE_APP_DIR }}
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          echo "Deploying GreenStreet commit: $DEPLOY_SHA"

          if [[ ! "$DEPLOY_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "ERROR: Invalid commit SHA"
            exit 1
          fi

          ssh \
            -i ~/.ssh/greenstreet_oracle \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$ORACLE_USER@$ORACLE_HOST" \
            "bash -s -- '$DEPLOY_SHA' '$ORACLE_APP_DIR'" <<'REMOTE'

          set -euo pipefail

          DEPLOY_SHA="$1"
          APP_DIR="$2"

          echo "Updating Oracle repository..."

          cd "$APP_DIR"

          git fetch origin feature/githubactions
          git checkout feature/githubactions
          git reset --hard "$DEPLOY_SHA"

          echo "Deploying GHCR images..."

          ./greenstreet/scripts/start-cloud.sh deploy "$DEPLOY_SHA"

          echo "Oracle deployment completed successfully."

          REMOTE

      - name: Deployment completed
        run: |
          echo "GreenStreet deployed successfully on Oracle Cloud."
          echo "Commit: $GITHUB_SHA"        