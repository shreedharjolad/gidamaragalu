name: GreenStreet CI

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

jobs:
  ci:
    name: GreenStreet CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Show repository
        run: |
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Branch: $GITHUB_REF_NAME"
          echo "Commit: $GITHUB_SHA"

      - name: Diagnose workspace
        run: |
          echo "=== Current Directory ==="
          pwd

          echo "=== Current Directory using PWD variable ==="
          echo "$PWD"

          echo "=== Repository root ==="
          ls -la

          echo "=== Find backend directories ==="
          find . -maxdepth 4 -type d -name backend -print

          echo "=== Find frontend directories ==="
          find . -maxdepth 4 -type d -name frontend -print

          echo "=== GreenStreet directory ==="
          ls -la greenstreet || true

          echo "=== GreenStreet backend ==="
          ls -la greenstreet/backend || true

          echo "=== GreenStreet frontend ==="
          ls -la greenstreet/frontend || true