name: GreenStreet CI

on:
  push:
    branches:
      - feature/githubactions
  pull_request:
    branches:
      - develop

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/shreedharjolad

jobs:
  backend:
    name: Backend CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        working-directory: greenstreet/backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check Python files
        working-directory: greenstreet/backend
        run: |
          python -m compileall app

      - name: Backend CI completed
        run: |
          echo "Backend CI completed successfully."


  frontend:
    name: Frontend CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: greenstreet/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: greenstreet/frontend
        run: |
          npm ci

      - name: Build frontend
        working-directory: greenstreet/frontend
        run: |
          npm run build

      - name: Frontend CI completed
        run: |
          echo "Frontend CI completed successfully."


  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs:
      - backend
      - frontend

    outputs:
      backend_image: ${{ steps.images.outputs.backend_image }}
      frontend_image: ${{ steps.images.outputs.frontend_image }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set image tags
        id: images
        run: |
          SHA_TAG="${GITHUB_SHA}"

          echo "backend_image=${IMAGE_PREFIX}/greenstreet-backend:${SHA_TAG}" >> "$GITHUB_OUTPUT"
          echo "frontend_image=${IMAGE_PREFIX}/greenstreet-frontend:${SHA_TAG}" >> "$GITHUB_OUTPUT"

          echo "Backend image: ${IMAGE_PREFIX}/greenstreet-backend:${SHA_TAG}"
          echo "Frontend image: ${IMAGE_PREFIX}/greenstreet-frontend:${SHA_TAG}"

      - name: Build backend Docker image
        working-directory: greenstreet/backend
        run: |
          docker build -t "${{ steps.images.outputs.backend_image }}" .

      - name: Build frontend Docker image
        working-directory: greenstreet/frontend
        run: |
          docker build -t "${{ steps.images.outputs.frontend_image }}" .

      - name: Show Docker images
        run: |
          docker images | grep greenstreet

      - name: Docker build completed
        run: |
          echo "Docker images built successfully."


  security:
    name: Trivy Security Scan
    runs-on: ubuntu-latest
    needs:
      - docker

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Build backend Docker image
        working-directory: greenstreet/backend
        run: |
          docker build -t "greenstreet-backend:scan" .

      - name: Build frontend Docker image
        working-directory: greenstreet/frontend
        run: |
          docker build -t "greenstreet-frontend:scan" .

      - name: Install Trivy
        run: |
          sudo apt-get update
          sudo apt-get install -y wget apt-transport-https gnupg lsb-release

          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key \
            | gpg --dearmor \
            | sudo tee /usr/share/keyrings/trivy.gpg > /dev/null

          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb $(lsb_release -sc) main" \
            | sudo tee /etc/apt/sources.list.d/trivy.list

          sudo apt-get update
          sudo apt-get install -y trivy

      - name: Scan backend image
        run: |
          trivy image --severity HIGH,CRITICAL --ignore-unfixed --format table greenstreet-backend:scan

      - name: Scan frontend image
        run: |
          trivy image --severity HIGH,CRITICAL --ignore-unfixed --format table greenstreet-frontend:scan

      - name: Security scan completed
        run: |
          echo "Trivy security scans completed successfully."


  publish:
    if: github.event_name == 'push'
    needs: [docker, security]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend
        run: |
          docker build \
            -t ghcr.io/shreedharjolad/greenstreet-backend:${GITHUB_SHA} \
            -t ghcr.io/shreedharjolad/greenstreet-backend:latest \
            greenstreet/backend

          docker push ghcr.io/shreedharjolad/greenstreet-backend:${GITHUB_SHA}
          docker push ghcr.io/shreedharjolad/greenstreet-backend:latest

      - name: Build and push Oracle frontend
        run: |
          docker build \
            -f greenstreet/frontend/Dockerfile-cloud \
            -t ghcr.io/shreedharjolad/greenstreet-frontend-cloud:${GITHUB_SHA} \
            -t ghcr.io/shreedharjolad/greenstreet-frontend-cloud:latest \
            greenstreet/frontend

          docker push ghcr.io/shreedharjolad/greenstreet-frontend-cloud:${GITHUB_SHA}
          docker push ghcr.io/shreedharjolad/greenstreet-frontend-cloud:latest