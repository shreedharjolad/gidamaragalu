apiVersion: apps/v1
kind: Deployment

metadata:
  name: minio
  namespace: greenstreet

spec:
  replicas: 1

  selector:
    matchLabels:
      app: minio

  template:
    metadata:
      labels:
        app: minio

    spec:
      containers:
      - name: minio

        image: "{{ .Values.minio.image.repository }}:{{ .Values.minio.image.tag }}"

        args:
        - server
        - /data
        - --console-address
        - ":9001"

        env:
        - name: MINIO_ROOT_USER
          valueFrom:
            secretKeyRef:
              name: minio-secret
              key: root-user

        - name: MINIO_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: minio-secret
              key: root-password

        ports:
        - containerPort: 9000

        - containerPort: 9001

        resources:

          requests:
            cpu: {{ .Values.minio.resources.requests.cpu | quote }}
            memory: {{ .Values.minio.resources.requests.memory | quote }}

          limits:
            cpu: {{ .Values.minio.resources.limits.cpu | quote }}
            memory: {{ .Values.minio.resources.limits.memory | quote }}

        volumeMounts:
        - name: minio-storage
          mountPath: /data

      volumes:
      - name: minio-storage
        persistentVolumeClaim:
          claimName: minio-pvc
