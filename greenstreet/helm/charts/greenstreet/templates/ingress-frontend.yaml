apiVersion: networking.k8s.io/v1
kind: Ingress

metadata:
  name: frontend-ingress
  namespace: {{ .Release.Namespace }}

spec:
  ingressClassName: nginx

  rules:
  - host: {{ .Values.ingress.host | quote }}

    http:
      paths:

        - path: /
          pathType: Prefix

          backend:
            service:
              name: frontend

              port:
                number: 80