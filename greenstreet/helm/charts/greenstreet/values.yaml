namespace: greenstreet

backend:
  replicaCount: 2

  image:
    repository: compose_backend
    tag: latest
    pullPolicy: Never
  
  service:
    port: 8000
  
  resources:
    requests:
      cpu: "250m"
      memory: "256Mi"

    limits:
      cpu: "500m"
      memory: "512Mi"

  hpa:
    enabled: true
    minReplicas: 1
    maxReplicas: 3
    cpuUtilization: 70

  pdb:
    enabled: true
    minAvailable: 1

frontend:
  replicaCount: 1

  image:
    repository: compose_frontend
    tag: latest
    pullPolicy: Never

  resources:
    requests:
      cpu: "100m"
      memory: "64Mi"

    limits:
      cpu: "250m"
      memory: "128Mi"

postgres:

  image:
    repository: postgres
    tag: "17"

  storage: 2Gi

  service:
    apiPort: 9000
    consolePort: 9001

  credentials:
    username: greenstreet
    password: greenstreet

  resources:

    requests:
      cpu: "250m"
      memory: "512Mi"

    limits:
      cpu: "500m"
      memory: "1Gi"

minio:

  image:
    repository: minio/minio
    tag: latest

  storage: 2Gi

  credentials:
    rootUser: admin
    rootPassword: password123

  resources:

    requests:
      cpu: "250m"
      memory: "256Mi"

    limits:
      cpu: "500m"
      memory: "512Mi"

config:
  corsOrigins: http://greenstreet.local:8080

  database:
    name: greenstreet

  minio:
    bucketName: tree-photos
    publicUrl: http://minio:9000

ingress:
  enabled: true
  className: nginx
  host: greenstreet.local