apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: greenstreet

spec:

  project: default

  source:
    repoURL: https://github.com/YOUR_USER/greenstreet.git
    targetRevision: HEAD
    path: k8s

  destination:
    server: https://kubernetes.default.svc
    namespace: default

  syncPolicy:
    automated:
      prune: true
      selfHeal: true