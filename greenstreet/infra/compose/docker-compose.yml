services:

  postgres:
    image: postgres:17

    environment:
      POSTGRES_DB: greenstreet
      POSTGRES_USER: greenstreet
      POSTGRES_PASSWORD: greenstreet

    ports:
      - "5432:5432"

  backend:
    build: ../../backend

    ports:
      - "8000:8000"

    depends_on:
      - postgres

  frontend:
    build: ../../frontend

    ports:
      - "4321:4321"

    depends_on:
      - backend

  minio:
    image: minio/minio

    container_name: minio

    command: server /data --console-address ":9001"

    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password123

    ports:
      - "9000:9000"
      - "9001:9001"

    volumes:
      - minio_data:/data

volumes:
  minio_data: