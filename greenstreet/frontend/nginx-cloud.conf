server {
    listen 80;
    listen [::]:80;

    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # GreenStreet API → FastAPI
    # /api/login      → backend /login
    # /api/trees      → backend /trees
    # /api/analytics  → backend /analytics
    location /api/ {
        proxy_pass http://backend:8000/;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # GreenStreet MinIO presigned URLs
    #
    # Public:
    # /minio/greenstreet/tree-7.jpg
    #
    # Internal:
    # /greenstreet/tree-7.jpg → minio:9000
    location /minio/ {
        proxy_pass http://minio:9000/;

        proxy_http_version 1.1;

        # IMPORTANT:
        # Presigned URL was signed using minio:9000.
        # Keep this Host header unchanged for MinIO signature validation.
        proxy_set_header Host minio:9000;

        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
    }

    # GreenStreet frontend
    location / {
        try_files $uri $uri/ /index.html;
    }
}